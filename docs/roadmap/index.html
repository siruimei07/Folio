<!--
  The explorer for docs/roadmap/roadmap.json. `pnpm roadmap build` inlines tools/lib.mjs at the
  lib placeholder and the data at the data placeholder; `pnpm roadmap serve` does the same on every load.
  Opened as a raw file it only explains how to run it.
-->
<style>
/* Layout: a sticky signal bar, a row of boards (tabs), and a lane panel that slides in from the right
   like a departure board. Tracks are the metro lines; lanes are the stations. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --band: #f7f8fa;
  --band-2: #eef1f5;
  --ink: #141820;
  --ink-2: #485062;
  --muted: #6f7788;
  --line: #dde2e9;
  --line-strong: #c3cad5;
  --accent: #1f5bd8;
  --accent-soft: #e2eafb;
  --accent-ink: #ffffff;
  --down: #7a45c9;
  --down-soft: #eee6fa;
  --st-done: #3d8a57;
  --st-review: #c48500;
  --st-wip: #2a78d6;
  --st-ready: #0b8a0b;
  --st-queued: #cf5f2b;
  --st-locked: #98a0ad;
  --st-dropped: #b3b9c3;
  --g-pass: #0b8a0b;
  --g-partial: #c48500;
  --g-fail: #d03b3b;
  --g-todo: #98a0ad;
  --g-na: #d3d8df;
  --t-core: #2a78d6;
  --t-ui: #eb6834;
  --t-design: #1baf7a;
  --t-verify: #eda100;
  --t-flow: #e87ba4;
  --risk-high: #d03b3b;
  --risk-med: #cf5f2b;
  --risk-low: #98a0ad;
  --shadow: 0 1px 2px rgb(20 24 32 / 0.06), 0 8px 24px rgb(20 24 32 / 0.08);
  --font-display: "Barlow Condensed", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #161a21; --surface-2: #1d222b; --band: #13171d; --band-2: #191e26;
    --ink: #e8ebf0; --ink-2: #b6bcc8; --muted: #8d94a3; --line: #272d37; --line-strong: #39414e;
    --accent: #6f9cff; --accent-soft: #1d2a45; --accent-ink: #0d1015; --down: #b28cf0; --down-soft: #2a2140;
    --st-done: #5cae78; --st-review: #e9ad2c; --st-wip: #5b9cf0; --st-ready: #2fbf2f; --st-queued: #ec8656; --st-locked: #6c7482; --st-dropped: #4f5664;
    --g-pass: #2fbf2f; --g-partial: #e9ad2c; --g-fail: #ec6767; --g-todo: #6c7482; --g-na: #343b47;
    --t-core: #3987e5; --t-ui: #d95926; --t-design: #199e70; --t-verify: #c98500; --t-flow: #d55181;
    --risk-high: #ec6767; --risk-med: #ec8656; --risk-low: #6c7482;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 30px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #161a21; --surface-2: #1d222b; --band: #13171d; --band-2: #191e26;
  --ink: #e8ebf0; --ink-2: #b6bcc8; --muted: #8d94a3; --line: #272d37; --line-strong: #39414e;
  --accent: #6f9cff; --accent-soft: #1d2a45; --accent-ink: #0d1015; --down: #b28cf0; --down-soft: #2a2140;
  --st-done: #5cae78; --st-review: #e9ad2c; --st-wip: #5b9cf0; --st-ready: #2fbf2f; --st-queued: #ec8656; --st-locked: #6c7482; --st-dropped: #4f5664;
  --g-pass: #2fbf2f; --g-partial: #e9ad2c; --g-fail: #ec6767; --g-todo: #6c7482; --g-na: #343b47;
  --t-core: #3987e5; --t-ui: #d95926; --t-design: #199e70; --t-verify: #c98500; --t-flow: #d55181;
  --risk-high: #ec6767; --risk-med: #ec8656; --risk-low: #6c7482;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 30px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 400 var(--step-0)/1.6 var(--font-body); margin: 0; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
:not(pre) > code { background: var(--surface-2); padding: 0.05em 0.35em; border-radius: 3px; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { padding-inline: 16px; max-width: 1440px; margin-inline: auto; }

/* Signal bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font: 700 1.75rem/1 var(--font-display); letter-spacing: 0.01em; }
.brand span { font: 600 1.25rem/1 var(--font-display); color: var(--ink-2); }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: var(--step--1); color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.stage::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-wip); }
.updated { font-size: var(--step--1); color: var(--muted); white-space: nowrap; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search input { width: 100%; padding: 6px 10px 6px 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); }
.search::before { content: ""; position: absolute; left: 10px; top: 50%; width: 10px; height: 10px; border: 2px solid var(--muted); border-radius: 50%; transform: translateY(-62%); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 500 11px var(--font-mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 4px; z-index: 30; max-height: 60vh; overflow: auto; }
.results button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--accent-soft); }
.results .mono { color: var(--muted); margin-left: auto; white-space: nowrap; }
.theme { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.theme button { border: 0; background: none; padding: 4px 9px; font-size: var(--step--1); cursor: pointer; color: var(--ink-2); }
.theme button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 12px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs kbd { font: 500 10px var(--font-mono); color: var(--muted); margin-left: 4px; }

main { padding-block: 20px 64px; }
section[role="tabpanel"] { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 12px; }
.panel h2 { font: 700 1.375rem/1.15 var(--font-display); letter-spacing: 0.01em; }
.panel h2 small { font: 500 var(--step--1) var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.panel header p { margin: 0; color: var(--muted); font-size: var(--step--1); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.scroll-x { overflow-x: auto; min-width: 0; }

/* Status pills and marks */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.5; padding: 0 8px 0 6px; border-radius: 999px; white-space: nowrap; color: var(--ink); background: color-mix(in srgb, var(--st) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); }
.mark { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--st); border: 2px solid var(--st); }
.mark[data-s="ready"], .mark[data-s="queued"] { background: transparent; }
.mark[data-s="locked"] { background: transparent; border-style: dashed; }
.mark[data-s="wip"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--st) 25%, transparent); }
[data-s="done"] { --st: var(--st-done); } [data-s="review"] { --st: var(--st-review); } [data-s="wip"] { --st: var(--st-wip); }
[data-s="ready"] { --st: var(--st-ready); } [data-s="queued"] { --st: var(--st-queued); } [data-s="locked"] { --st: var(--st-locked); } [data-s="dropped"] { --st: var(--st-dropped); }
[data-t="core"] { --t: var(--t-core); } [data-t="ui"] { --t: var(--t-ui); } [data-t="design"] { --t: var(--t-design); } [data-t="verify"] { --t: var(--t-verify); } [data-t="flow"] { --t: var(--t-flow); }
.track { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.track::before { content: ""; width: 14px; height: 4px; border-radius: 2px; background: var(--t); }
.tag { font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.gates { display: inline-flex; gap: 3px; vertical-align: middle; }
.gate { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font: 600 10px/1 var(--font-mono); color: var(--surface); background: var(--g); }
.gate[data-g="pass"] { --g: var(--g-pass); } .gate[data-g="partial"] { --g: var(--g-partial); } .gate[data-g="fail"] { --g: var(--g-fail); }
.gate[data-g="todo"] { --g: transparent; color: var(--g-todo); box-shadow: inset 0 0 0 1.5px var(--g-todo); }
.gate[data-g="na"] { --g: transparent; color: var(--g-na); box-shadow: inset 0 0 0 1px var(--g-na); }
.effort { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--font-mono); color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 6px 0 4px; }
.effort i { display: inline-flex; gap: 1.5px; }
.effort i b { width: 3px; height: 9px; border-radius: 1px; background: var(--line-strong); }
.effort i b.on { background: var(--accent); }
.effort[data-m="sonnet"] i b.on { background: var(--down); }
.tag.codex { font-weight: 600; color: var(--ink); background: var(--accent-soft); border-color: transparent; }
.prompt + .prompt { margin-top: 12px; }
.prompt h3 { margin: 0 0 4px; }
.codex-desk { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.codex-desk > div { display: grid; gap: 6px; align-content: start; min-width: 0; }
.codex-desk ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.codex-desk li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 3px 10px; font-size: var(--step--1); cursor: pointer; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: var(--step--1); cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.filters .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.filters .label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.lane-link { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-weight: 500; }
.lane-link:hover { color: var(--accent); text-decoration: underline; }

/* Now */
.hero { display: grid; gap: 8px; }
.hero h1 { font: 700 var(--step-3)/1.05 var(--font-display); letter-spacing: 0.005em; }
.hero ul { margin: 0; padding-left: 1.2em; max-width: 78ch; color: var(--ink-2); }
.hero li + li { margin-top: 4px; }
.statusbar { display: flex; height: 14px; gap: 2px; margin-top: 6px; }
.statusbar span { background: var(--st); border-radius: 2px; min-width: 3px; }
.statusbar span:first-child { border-radius: 4px 2px 2px 4px; } .statusbar span:last-child { border-radius: 2px 4px 4px 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.queue { list-style: none; margin: 0; padding: 0; counter-reset: q; display: grid; }
.queue li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; counter-increment: q; }
.queue li:first-child { border-top: 0; }
.queue li::before { content: counter(q); font: 700 1.375rem/1.1 var(--font-display); color: var(--muted); text-align: right; }
.queue .why { font-size: var(--step--1); color: var(--ink-2); }
.queue .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-width: 0; }
.slots { display: grid; gap: 12px; }
.slot-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: start; }
.slot-row > div:first-child b { display: block; font-weight: 600; }
.slot-row > div:first-child span { font-size: 12px; color: var(--muted); }
.slot-boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.slot { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 6px 8px; min-height: 48px; font-size: var(--step--1); color: var(--muted); display: grid; align-content: center; }
.slot.full { border-style: solid; border-color: color-mix(in srgb, var(--st-wip) 45%, transparent); background: color-mix(in srgb, var(--st-wip) 8%, var(--surface)); color: var(--ink); }
.slot.full .id { font-size: 11px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); display: grid; gap: 6px; min-width: 0; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card .title { font-weight: 600; }
.card .next { font-size: var(--step--1); color: var(--ink-2); }
.decisions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.decisions li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }
.decisions .when { font-size: 12px; color: var(--muted); grid-column: 2; }
.kind { font-size: 11.5px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2); height: fit-content; white-space: nowrap; }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chain .sep { color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--step--1); }
.log time { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 8px; }

/* Graph */
.graph-wrap { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 72vh; cursor: grab; touch-action: pan-x pan-y; }
.graph-wrap.dragging { cursor: grabbing; }
.graph-wrap svg { display: block; }
svg text { font-family: var(--font-body); fill: var(--ink); }
.g-band { fill: var(--band); } .g-band.alt { fill: var(--band-2); }
.g-phase { font: 700 15px var(--font-display); fill: var(--ink-2); letter-spacing: 0.02em; }
.g-phase-sub { font-size: 11px; fill: var(--muted); }
.g-track { font: 700 14px var(--font-display); fill: var(--ink); }
.g-track-hint { font-size: 10.5px; fill: var(--muted); }
.g-sync { stroke: var(--line-strong); stroke-dasharray: 4 4; }
.g-trackline { stroke: var(--t); stroke-width: 3; stroke-linecap: round; opacity: 0.85; }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.edge.done { stroke: var(--line); }
.edge.crit { stroke: var(--accent); stroke-width: 2.5; }
.node { cursor: pointer; }
.node circle.hit { fill: transparent; }
.node .shape { stroke-width: 2.5; }
.node text { font-size: 12.5px; }
.node .sub { font: 10.5px var(--font-mono); fill: var(--muted); }
.node.crit .ring { stroke: var(--accent); stroke-width: 2; fill: none; }
.node:focus-visible { outline: none; }
.node:focus-visible .shape, .node:hover .shape { filter: drop-shadow(0 0 3px var(--accent)); }
.node.sel .label { font-weight: 700; }
.has-sel .node:not(.rel), .has-sel .edge:not(.rel) { opacity: 0.18; }
.has-sel .edge.up { stroke: var(--accent); stroke-width: 2.5; opacity: 1; }
.has-sel .edge.down { stroke: var(--down); stroke-width: 2.5; opacity: 1; }
.pulse { fill: var(--st-wip); opacity: 0.25; transform-origin: center; transform-box: fill-box; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(0.6); opacity: 0.45; } 100% { transform: scale(1.9); opacity: 0; } }
.graph-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.zoom { display: inline-flex; gap: 4px; }
.keyline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.keyline i { width: 18px; height: 3px; border-radius: 2px; background: var(--k); }

/* Parallel matrix */
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.matrix th.phase { min-width: 150px; font: 700 14px var(--font-display); color: var(--ink); }
.matrix th.phase small { display: block; font: 400 11px var(--font-body); color: var(--muted); }
.matrix th.phase.sync, .matrix td.sync { background: var(--band); }
.matrix th.trk { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 110px; }
.matrix .cell { display: grid; gap: 4px; }
.mini { display: flex; gap: 6px; align-items: center; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; color: var(--ink); font-size: 12.5px; line-height: 1.35; }
.mini:hover { color: var(--accent); }
.chart-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--t); display: inline-block; }
.axis text { font-size: 11px; fill: var(--muted); }
.axis line { stroke: var(--line); }
.bar-seg:hover, .bar-seg:focus-visible { filter: brightness(1.12); outline: none; }

/* Board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { display: grid; align-content: start; gap: 8px; min-width: 0; }
.col > h3 { display: flex; align-items: center; gap: 8px; font: 700 1.125rem/1.2 var(--font-display); padding: 2px 2px 6px; border-bottom: 2px solid var(--st); }
.col > h3 b { margin-left: auto; font: 600 var(--step--1) var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Milestones */
.line { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; margin: 8px 0 4px; }
.line::before { content: ""; position: absolute; left: 10%; right: 10%; top: 14px; height: 4px; background: var(--line-strong); border-radius: 2px; }
.stop { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; padding-inline: 4px; border: 0; background: none; cursor: pointer; color: var(--ink); }
.stop .dot { width: 32px; height: 32px; border-radius: 50%; border: 4px solid var(--st); background: var(--surface); display: grid; place-items: center; font: 700 13px var(--font-display); }
.stop[data-s="done"] .dot { background: var(--st); color: var(--surface); }
.stop[data-s="wip"] .dot { box-shadow: 0 0 0 6px color-mix(in srgb, var(--st) 22%, transparent); }
.stop b { font: 700 1.0625rem/1.15 var(--font-display); }
.stop span { font-size: 12px; color: var(--muted); }
.ms { display: grid; gap: 12px; }
.ms-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ms-head h3 { font: 700 var(--step-2)/1.1 var(--font-display); }
.ms ul { margin: 0; padding-left: 1.2em; color: var(--ink-2); font-size: var(--step--1); }
.clickrow { cursor: pointer; }
.clickrow:hover td { background: var(--band); }

/* Files */
.conflict { color: var(--g-fail); font-weight: 600; white-space: nowrap; }
.role { font-size: 11px; color: var(--muted); }
.risk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.rules { margin: 0; padding-left: 1.6em; display: grid; gap: 4px; }
.rules li::marker { font: 700 1rem var(--font-display); color: var(--muted); }

/* Maintain */
.cmds { display: grid; gap: 6px; }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
.cmd code { font-size: 12.5px; overflow-wrap: anywhere; }
.cmd span { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
pre { margin: 0; font: 12px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--band-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; max-height: 360px; overflow: auto; }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }

/* Drawer */
.drawer { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); transition: transform 0.18s ease-out; }
.drawer[hidden] { display: none !important; }
.drawer > header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.drawer h2 { font: 700 1.75rem/1.1 var(--font-display); padding-right: 84px; }
.drawer h2:focus { outline: none; }
.drawer .close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; }
.drawer .body { overflow: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
.drawer h3 { font: 700 1rem/1.2 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.drawer .next { background: var(--accent-soft); border-radius: var(--radius); padding: 8px 10px; }
.drawer .hold { background: color-mix(in srgb, var(--st-queued) 12%, var(--surface)); border-radius: var(--radius); padding: 8px 10px; }
.deplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.deplist li { display: flex; gap: 8px; align-items: center; min-width: 0; }
.gatelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.gatelist div { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); }
.paths { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font: 12px/1.5 var(--font-mono); overflow-wrap: anywhere; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(10 12 16 / 0.35); }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--surface); border-radius: var(--radius); padding: 6px 9px; font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow); }
.tip b { display: block; }
.tip .mono { opacity: 0.75; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: var(--step--1); }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-2); }
.empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }

@media (max-width: 760px) {
  .bar { position: static; }
  .brand { flex-wrap: wrap; row-gap: 6px; }
  .brand > span { white-space: nowrap; }
  .brand b { font-size: 1.5rem; }
  .updated { display: none; }
  .search { max-width: none; order: 5; flex-basis: 100%; }
  .slot-row { grid-template-columns: 1fr; }
  .queue li { grid-template-columns: 28px minmax(0, 1fr); }
  .queue .actions { grid-column: 2; justify-content: flex-start; }
  .line { grid-template-columns: repeat(5, minmax(64px, 1fr)); overflow-x: auto; }
  .stop span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; opacity: 0; }
  .drawer { transition: none; }
}
</style>

<div class="bar">
  <div class="wrap bar-top">
    <div class="brand"><b>Folio</b><span>路径图</span><span class="stage" id="stage"></span></div>
    <span class="updated" id="updated"></span>
    <div class="search" role="search">
      <input id="q" type="search" placeholder="搜索 lane、分支、路径…" aria-label="搜索 lane" autocomplete="off" aria-controls="results" aria-expanded="false">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <div class="theme" role="group" aria-label="外观">
      <button type="button" id="theme-system" data-theme-choice="system">系统</button>
      <button type="button" id="theme-light" data-theme-choice="light">浅色</button>
      <button type="button" id="theme-dark" data-theme-choice="dark">深色</button>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="视图"></nav></div>
</div>

<main class="wrap" id="main"></main>
<div class="empty wrap" id="no-data" hidden>
  <p>这是路径图的模板，没有数据。在 Folio 目录里运行 <code>pnpm roadmap serve</code>，再打开 <code>http://localhost:5199</code>；发布用的单文件由 <code>pnpm roadmap build</code> 生成。</p>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden></aside>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/*@lib*/
const DATA = /*@data*/null;

(() => {
  'use strict';
  if (!DATA) {
    document.getElementById('no-data').hidden = false;
    document.querySelector('.bar').hidden = true;
    return;
  }

  // ---------- Derived data ----------
  const D = DATA;
  const LANES = byId(D);
  const DEPENDENTS = dependents(D);
  const SHOWN = new Map(D.lanes.map((l) => [l.id, displayStatus(l, LANES)]));
  const TRACK = new Map(D.tracks.map((t) => [t.id, t]));
  const AGENT = new Map(D.agents.map((a) => [a.id, a]));
  const PHASE = new Map(D.phases.map((p, index) => [p.id, { ...p, index }]));
  const MILESTONE = new Map(D.milestones.map((m) => [m.id, m]));
  const ORDER = ['wip', 'review', 'ready', 'queued', 'locked', 'done', 'dropped'];
  const FOCUS_GATE = D.lanes.find((l) => l.kind === 'gate' && l.milestone === D.now.focus);
  const CRITICAL = FOCUS_GATE ? criticalPath(D, FOCUS_GATE.id).path : [];
  const CRIT = new Set(CRITICAL);
  const GATE_LABEL = { pass: '通过', partial: '部分通过', fail: '失败', todo: '待做', na: '不适用' };
  const GATE_GLYPH = { pass: '✓', partial: '½', fail: '✕', todo: '', na: '–' };
  const DECISION_KIND = { approve: '批准', decide: '决定', manual: '手动' };
  const RISK_LABEL = { high: '高', med: '中', low: '低' };
  const latest = [D.meta.updated?.slice(0, 10) ?? '', ...D.lanes.map((l) => l.updated), ...D.log.map((x) => x.at)].sort().pop();
  const byStatus = (a, b) => DISPLAY[SHOWN.get(a.id)].order - DISPLAY[SHOWN.get(b.id)].order || a.id.localeCompare(b.id);

  // ---------- Tiny DOM helpers (text always via textContent) ----------
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    applyProps(el, props);
    append(el, children);
    return el;
  }
  function s(tag, props, ...children) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    applyProps(el, props);
    append(el, children);
    return el;
  }
  function applyProps(el, props) {
    for (const [key, value] of Object.entries(props ?? {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key === 'class') el.setAttribute('class', value);
      else if (key === 'text') el.textContent = value;
      else el.setAttribute(key, value === true ? '' : value);
    }
  }
  function append(el, children) {
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }
  const $ = (sel) => document.querySelector(sel);
  const store = {
    get(key, fallback) {
      try {
        const value = localStorage.getItem(`folio-roadmap:${key}`);
        return value === null ? fallback : JSON.parse(value);
      } catch {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(`folio-roadmap:${key}`, JSON.stringify(value));
      } catch {
        /* storage blocked: the setting lasts for this visit only */
      }
    },
  };

  // ---------- Shared pieces ----------
  /** Text with `code` spans, as the data writes commands and paths. */
  const rich = (text) => String(text ?? '').split('`').map((part, i) => (i % 2 ? h('code', {}, part) : part));
  /** Shortens a graph label to about `max` px: CJK and full-width glyphs count double. */
  function fit(text, max = 146) {
    let width = 0;
    let out = '';
    for (const ch of text) {
      width += /[⺀-￿]/.test(ch) ? 12.5 : 7;
      if (width > max) return `${out}…`;
      out += ch;
    }
    return out;
  }
  const pill =(status) => h('span', { class: 'pill', 'data-s': status }, h('span', { class: 'mark', 'data-s': status }), DISPLAY[status].label);
  const statusOf = (lane) => SHOWN.get(lane.id);
  /** Recommended model and reasoning effort, with a five-step meter. */
  function effortTag(lane) {
    const codex = isCodex(lane);
    const model = codex ? auditModelFor(lane) : modelFor(lane);
    const name = modelName(D, model);
    const level = codex ? auditEffortFor(lane) : effortFor(lane);
    const n = EFFORTS.indexOf(level) + 1;
    const own = codex ? lane.auditModel || lane.auditEffort : lane.model || lane.effort;
    const title = `${codex ? 'Codex 实现；Claude Code 快速审计推荐' : '推荐'} ${name}，推理强度 ${level}${own ? '' : '（按规模和轨道的默认值）'}`;
    return h('span', { class: 'effort', 'data-m': model, title },
      h('i', { 'aria-hidden': 'true' }, EFFORTS.map((_, i) => h('b', { class: i < n ? 'on' : null }))), `${codex ? '审计 · ' : ''}${name} · ${level}`);
  }
  /** Marks a lane Codex builds; a Claude Code session audits it. */
  const codexTag = (lane) => (isCodex(lane) ? h('span', { class: 'tag codex', title: 'Codex 做后端实现，Claude Code 快速审计后合并' }, 'Codex') : null);
  const trackTag = (id) => h('span', { class: 'track', 'data-t': id }, TRACK.get(id)?.label ?? id);
  const agentName = (id) => AGENT.get(id)?.label ?? id;
  const phaseLabel = (id) => PHASE.get(id)?.label ?? id;
  const laneLink = (lane, text) => h('button', { type: 'button', class: 'lane-link', onclick: () => openLane(lane.id) }, text ?? lane.title);
  function gatesRow(lane) {
    if (!lane.gates) return null;
    return h('span', { class: 'gates', 'aria-label': '检查' },
      Object.entries(GATES).map(([key, label]) => {
        const state = lane.gates[key] ?? 'na';
        return h('span', { class: 'gate', 'data-g': state, title: `${label}：${GATE_LABEL[state]}`, 'aria-label': `${label} ${GATE_LABEL[state]}` }, GATE_GLYPH[state]);
      }));
  }
  function githubPath(lane, path) {
    const clean = path.replace(/#.*$/, '').replace(/\*.*$/, '').replace(/\/$/, '');
    const ref = lane && ['wip', 'review'].includes(lane.status) ? lane.id : 'main';
    return `${D.meta.repo}/blob/${ref}/${clean}`;
  }
  function toast(text) {
    const el = $('#toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => (el.hidden = true), 1800);
  }
  function copy(text, fallbackNode) {
    const done = () => toast('已复制');
    const fail = () => {
      if (fallbackNode) {
        const range = document.createRange();
        range.selectNodeContents(fallbackNode);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast('已选中，按 Ctrl+C 复制');
      } else toast('这个窗口不允许复制');
    };
    try {
      navigator.clipboard.writeText(text).then(done, fail);
    } catch {
      fail();
    }
  }
  function promptCard(text, heading, hint, button) {
    const pre = h('pre', {}, text);
    return h('div', { class: 'prompt' },
      heading ? h('h3', {}, heading) : null,
      h('div', { class: 'row', style: 'justify-content: space-between; margin-bottom: 6px' },
        h('span', { class: 'row small muted' }, ...hint),
        h('button', { type: 'button', class: 'btn primary', onclick: () => copy(text, pre) }, button)),
      pre);
  }
  function promptBlock(lane) {
    const codex = codexPrompts(D, lane);
    if (codex) {
      return h('div', {},
        codex.handoff ? promptCard(codex.handoff, '交给 Codex', ['完整交接：新开 Codex session，粘贴；它做完停在 review'], '复制 Codex 提示词') : null,
        promptCard(codex.audit, 'Claude 快速审计', ['Codex 到 review 后新开 Claude Code session，选', effortTag(lane), '，再粘贴'], '复制审计提示词'));
    }
    const text = composePrompt(D, lane);
    if (!text) return null;
    return promptCard(text, null, [lane.prompt ? '新开 session，选' : '通用开工提示词；新开 session，选', effortTag(lane), '，再粘贴'], '复制提示词');
  }
  const tip = $('#tip');
  function showTip(event, lines) {
    tip.replaceChildren(...lines.map((line, i) => (i === 0 ? h('b', {}, line) : h('div', {}, line))));
    tip.hidden = false;
    const x = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8);
    const y = Math.min(event.clientY + 14, innerHeight - tip.offsetHeight - 8);
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${Math.max(8, y)}px`;
  }
  const hideTip = () => (tip.hidden = true);
  function tipFor(el, lines) {
    el.addEventListener('pointermove', (e) => showTip(e, lines()));
    el.addEventListener('pointerleave', hideTip);
    el.addEventListener('focus', () => {
      const r = el.getBoundingClientRect();
      showTip({ clientX: r.right, clientY: r.bottom }, lines());
    });
    el.addEventListener('blur', hideTip);
  }
  function statusBar(lanes) {
    const counts = ORDER.map((st) => [st, lanes.filter((l) => statusOf(l) === st).length]).filter(([, n]) => n);
    const bar = h('div', { class: 'statusbar', role: 'img', 'aria-label': counts.map(([st, n]) => `${DISPLAY[st].label} ${n}`).join('，') },
      counts.map(([st, n]) => {
        const seg = h('span', { 'data-s': st, style: `flex: ${n}` });
        tipFor(seg, () => [`${DISPLAY[st].label}：${n} 个 lane`]);
        return seg;
      }));
    const legend = h('div', { class: 'legend' }, counts.map(([st, n]) => h('span', {}, h('span', { class: 'mark', 'data-s': st }), DISPLAY[st].label, h('b', {}, n))));
    return [bar, legend];
  }

  // ---------- State and routing ----------
  const TABS = [
    { id: 'now', label: '现在', render: renderNow },
    { id: 'graph', label: '依赖图', render: renderGraph },
    { id: 'parallel', label: '并行', render: renderParallel },
    { id: 'board', label: '看板', render: renderBoard },
    { id: 'milestones', label: '里程碑', render: renderMilestones },
    { id: 'files', label: '文件归属', render: renderFiles },
    { id: 'decisions', label: '决策与风险', render: renderDecisions },
    { id: 'maintain', label: '给 agent', render: renderMaintain },
  ];
  const state = {
    tab: 'now',
    lane: null,
    graph: { milestone: store.get('graph-milestone', D.now.focus), hideDone: store.get('graph-hide-done', false), critical: true, zoom: store.get('graph-zoom', 1) },
    board: { milestone: 'all', track: 'all', agent: 'all', showDone: false },
    parallel: { milestone: 'all', table: false },
    files: { sharedOnly: true, includePlanned: false },
  };

  function setHash() {
    const token = state.lane ? `lane-${anchor(state.lane)}` : state.tab;
    history.replaceState(null, '', `#${token}`);
  }
  function readHash() {
    const token = location.hash.slice(1);
    if (token.startsWith('lane-')) {
      const lane = D.lanes.find((l) => anchor(l.id) === token.slice(5));
      if (lane) {
        openLane(lane.id, { keepHash: true });
        return;
      }
    }
    if (TABS.some((t) => t.id === token)) selectTab(token, { keepHash: true });
  }

  function renderTabs() {
    $('#tabs').replaceChildren(...TABS.map((tab, i) =>
      h('button', {
        type: 'button', role: 'tab', id: `tab-${tab.id}`, 'aria-selected': String(state.tab === tab.id), 'aria-controls': 'panel',
        tabindex: state.tab === tab.id ? '0' : '-1', onclick: () => selectTab(tab.id),
      }, tab.label, h('kbd', {}, String(i + 1)))));
  }
  function selectTab(id, { keepHash } = {}) {
    if (state.tab !== id) scrollTo(0, 0);
    state.tab = id;
    renderTabs();
    const tab = TABS.find((t) => t.id === id);
    const panel = h('section', { role: 'tabpanel', id: 'panel', 'aria-labelledby': `tab-${id}` });
    $('#main').replaceChildren(panel);
    tab.render(panel);
    if (!keepHash) setHash();
  }
  function rerender() {
    const scroll = $('.graph-wrap');
    const pos = scroll ? [scroll.scrollLeft, scroll.scrollTop] : null;
    selectTab(state.tab, { keepHash: true });
    const again = $('.graph-wrap');
    if (pos && again) [again.scrollLeft, again.scrollTop] = pos;
  }

  // ---------- Now ----------
  function renderNow(root) {
    const active = D.lanes.filter((l) => l.status !== 'dropped');
    root.append(
      h('div', { class: 'panel hero' },
        h('span', { class: 'small muted' }, `${MILESTONE.get(D.now.focus)?.title ?? ''} · ${D.lanes.length} 个 lane`),
        h('h1', {}, D.now.stage),
        h('ul', {}, D.now.summary.map((line) => h('li', {}, rich(line)))),
        statusBar(active)),
      h('div', { class: 'grid-2' },
        h('div', { class: 'panel' },
          h('header', {}, h('h2', {}, '合并队列', h('small', {}, '一次合并一个')), h('p', {}, '格子是检查：pnpm check、e2e、code review、security review、simplify、设计评审、无障碍')),
          queueList()),
        h('div', { style: 'display: grid; gap: 20px; align-content: start' },
          h('div', { class: 'panel' },
            h('header', {}, h('h2', {}, '并行槽位'), h('p', {}, '进行中的 lane 占用的 session 名额')),
            slotsPanel()),
          h('div', { class: 'panel' },
            h('header', {}, h('h2', {}, '需要你')),
            decisionList(D.decisions.filter((d) => d.state === 'open' || d.state === 'recurring'))))),
      h('div', { class: 'panel' },
        h('header', {}, h('h2', {}, '现在可以开', h('small', {}, '依赖都合并了')), h('p', {}, '⏳ 表示依赖已满足，但有理由先等一等')),
        h('div', { class: 'cards' }, D.lanes.filter((l) => ['ready', 'queued'].includes(statusOf(l))).sort(byStatus).map(laneCard))),
      codexDesk(),
      h('div', { class: 'grid-2' },
        h('div', { class: 'panel' },
          h('header', {}, h('h2', {}, '关键路径'), h('p', {}, `到 ${FOCUS_GATE?.title ?? ''} 最长的一串未完成工作（按规模加权）`)),
          h('div', { class: 'chain' }, CRITICAL.flatMap((id, i) => [i ? h('span', { class: 'sep' }, '→') : null, h('span', { class: 'row' }, h('span', { class: 'mark', 'data-s': SHOWN.get(id) }), laneLink(LANES.get(id)))]))),
        h('div', { class: 'panel' },
          h('header', {}, h('h2', {}, '最近更新')),
          h('ul', { class: 'log' }, [...D.log].reverse().slice(0, 6).map((entry) => h('li', {}, h('time', {}, entry.at), entry.text, h('span', { class: 'muted' }, ` · ${entry.by}`)))))));
  }

  function pick(id) {
    results.hidden = true;
    q.setAttribute('aria-expanded', 'false');
    openLane(id);
  }
  q.addEventListener('input', search);
  q.addEventListener('keydown', (e) => {
    const options = [...results.querySelectorAll('[role="option"]')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!options.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
      options.forEach((o, i) => o.setAttribute('aria-selected', String(i === active)));
    } else if (e.key === 'Enter' && options[active]) {
      e.preventDefault();
      options[active].click();
    } else if (e.key === 'Escape') {
      results.hidden = true;
      q.blur();
    }
  });
  q.addEventListener('blur', () => setTimeout(() => (results.hidden = true), 150));

  // ---------- Theme ----------
  function applyTheme(choice) {
    if (choice === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', choice);
    for (const b of document.querySelectorAll('[data-theme-choice]')) b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice));
    store.set('theme', choice);
  }
  for (const b of document.querySelectorAll('[data-theme-choice]')) b.addEventListener('click', () => applyTheme(b.dataset.themeChoice));
  const savedTheme = store.get('theme', 'system');
  if (savedTheme === 'system') applyTheme('system'); else applyTheme(savedTheme);

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest('input, textarea, [contenteditable]');
    if (e.key === 'Escape' && !typing) closeLane();
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      q.focus();
    } else if (/^[1-8]$/.test(e.key)) {
      selectTab(TABS[Number(e.key) - 1].id);
    } else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute('role') === 'tab') {
      const i = TABS.findIndex((t) => t.id === state.tab);
      const next = TABS[(i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length];
      selectTab(next.id);
      document.getElementById(`tab-${next.id}`).focus();
    }
  });
  addEventListener('hashchange', readHash);

  // ---------- Start ----------
  $('#stage').textContent = D.now.stage;
  $('#updated').textContent = `数据更新于 ${latest}`;
  selectTab('now', { keepHash: true });
  readHash();
})();
</script>
