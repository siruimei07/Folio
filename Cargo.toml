[workspace]
resolver = "3"
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Sirui Mei"]
publish = false

[workspace.dependencies]
folio-core = { path = "crates/folio-core" }
# SQLite 3.53 with FTS5, compiled in (ADR-0002).
rusqlite = { version = "0.40.2", features = ["bundled", "pointer", "fallible_uint"] }
rusqlite_migration = "2.6.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"
proptest = "1.11.0"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# Ids for libraries and tags (ADR-0002 §3); the version tempfile already uses.
getrandom = "0.4.3"
# Content hashes (ADR-0003 §2).
blake3 = "1.8.7"
# Gitignore semantics for ignore rules (ADR-0003 §10); only its `gitignore` module is used.
ignore = "0.4.33"
# The version Tauri's own dependencies (muda, softbuffer) already use, so it compiles only once.
windows-sys = "0.61.2"
# COM bindings for the few interfaces windows-sys lacks; the versions Tauri, tao and wry already
# use. The `#[implement]` macro refers to windows-core by name, so it is a direct dependency too.
windows = "=0.61.3"
windows-core = "=0.61.2"
# Tauri 2.11: 2.12 was released on scaffold day, inside the one-day minimum release age. The exact
# requirements below hold only these two crates; Cargo.lock holds the rest of the Tauri family
# (tauri-runtime, tauri-utils, wry), so update them with `cargo update -p <crate> --precise`,
# never a bare `cargo update`. The Tauri CLI refuses to build when @tauri-apps/api is on another
# major.minor.
tauri = { version = "=2.11.6", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
# Release candidates: pinned exactly (ADR-0001 §4). Upgrade only together.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[workspace.lints.rust]
unsafe_code = "deny"
