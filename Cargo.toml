[workspace]
resolver = "3"
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Sirui Mei"]
publish = false

[workspace.dependencies]
folio-core = { path = "crates/folio-core" }
# SQLite 3.53 with FTS5, compiled in (ADR-0002).
rusqlite = { version = "0.40.2", features = ["bundled", "pointer", "fallible_uint"] }
rusqlite_migration = "2.6.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"
proptest = "1.11.0"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# UTC timestamps and daily log dates; Tauri's own dependencies already use it.
time = "0.3.55"
# Ids for libraries and tags (ADR-0002 §3).
getrandom = "0.4.3"
# Content hashes (ADR-0003 §2).
blake3 = "1.8.7"
# M2 history, extraction and AI transport (versioning.md §18). Defaults stay off so
# optional ZIP codecs/writer dependencies and alternate TLS providers stay off.
zstd = { version = "=0.14.0", default-features = false }
similar = { version = "=3.2.0", default-features = false, features = ["std", "text", "inline"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false }
encoding_rs = "=0.8.42"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# Gitignore semantics for ignore rules (ADR-0003 §10); only its `gitignore` module is used.
ignore = "0.4.33"
# The version Tauri's own dependencies (muda, softbuffer) already use, so it compiles only once.
windows-sys = "0.61.2"
# COM bindings for the few interfaces windows-sys lacks; the versions Tauri, tao and wry already
# use (a folio-app test checks that each compiles once). The `#[implement]` macro refers to
# windows-core by name, so it is a direct dependency too.
windows = "=0.62.2"
windows-core = "=0.62.2"
# WebView2's COM interfaces, at the version wry already uses (the same test checks it).
webview2-com = "=0.39.1"
# Tauri: the exact requirements below hold only these two crates; Cargo.lock holds the rest of the
# family (tauri-runtime, tauri-utils, wry), so update them with `cargo update -p <crate> --precise`,
# never a bare `cargo update`. The Tauri CLI refuses to build when @tauri-apps/api is on another
# major.minor.
tauri = { version = "=2.12.0", features = [] }
tauri-build = { version = "=2.7.0", features = [] }
# Release candidates: pinned exactly (ADR-0001 §4). Upgrade only together.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[workspace.lints.rust]
unsafe_code = "deny"
