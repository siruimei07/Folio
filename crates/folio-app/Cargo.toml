[package]
name = "folio-app"
description = "Folio desktop shell: a thin Tauri layer over folio-core (ADR-0001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

# main.rs only calls `run()`; skip linking an empty, Tauri-sized test binary for it.
[[bin]]
name = "folio-app"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
folio-core = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "macros"] }
unicode-normalization = { workspace = true }
# Native shell integration: the snap overlay, folder picker and registered cloud sync roots.
# `IRawElementProviderSimple` needs the Com, Ole and Variant features.
windows = { workspace = true, features = [
  "Win32_Data_Xml_MsXml",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_WinRT",
  "Win32_Globalization",
  "Storage_Provider",
] }
windows-core = { workspace = true }
windows-sys = { workspace = true, features = [
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = { workspace = true }
specta-typescript = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
