name: Commits

# Every commit is Sirui's and carries no agent attribution (CLAUDE.md §7.1 rule 5). Unlike
# ci.yml this also runs for docs-only pushes, and it reads the whole history: a land can
# fast-forward several commits at once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: Commit identity and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned like ci.yml (CLAUDE.md §5); update the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/check-commits.test.mjs
      - run: node scripts/check-commits.mjs --all
